<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Night Harbor hierarchical simulation</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1220;
      color: #d7e6ff;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-size: 1.35rem;
    }
    p {
      margin: 0;
      opacity: 0.75;
      font-size: 0.9rem;
    }
    canvas {
      border: 1px solid #31425f;
      background: #071018;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      max-width: 96vw;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Night Harbor</h1>
  <p>hierarchical simulation</p>
  <canvas id="scene" width="960" height="540"></canvas>
  <script src="js/entities.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
